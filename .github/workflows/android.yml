name: Android Build & Test

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build & Test Android App
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      # This repo has no Gradle wrapper committed (no gradlew / gradle-wrapper.jar),
      # so the Gradle version is pinned here instead. It must stay in sync with
      # gradle/wrapper/gradle-wrapper.properties. AGP 9.x requires Gradle 9.x.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.1'

      - name: Prepare Environment Files
        run: |
          # The secrets-gradle-plugin is configured with propertiesFileName = ".env",
          # which is gitignored, so recreate it from the checked-in example.
          cp .env.example .env

      - name: Generate Debug Keystore
        run: |
          # app/build.gradle.kts declares a "debugConfig" signing config pointing at
          # <rootDir>/debug.keystore, which is gitignored. Recreate it with the
          # standard AOSP debug credentials so :app:assembleDebug can sign.
          if [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          elif [ ! -f debug.keystore ]; then
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storetype PKCS12 \
              -storepass android \
              -keypass android \
              -alias androiddebugkey \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Run Unit Tests
        run: gradle :app:testDebugUnitTest --stacktrace

      - name: Build Debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v5
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: Upload Test Reports
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: unit-test-reports
          path: |
            app/build/reports/tests/
            app/build/test-results/
          retention-days: 7
          if-no-files-found: ignore
