name: Android Build & Test

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build & Test Android App
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      # This repo has no Gradle wrapper committed (no gradlew / gradle-wrapper.jar),
      # so the Gradle version is pinned here instead. It must stay in sync with
      # gradle/wrapper/gradle-wrapper.properties. AGP 9.x requires Gradle 9.x.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.1'

      - name: Prepare Environment Files
        run: |
          # The secrets-gradle-plugin is configured with propertiesFileName = ".env",
          # which is gitignored, so recreate it from the checked-in example.
          cp .env.example .env

      - name: Generate Debug Keystore
        run: |
          # app/build.gradle.kts declares a "debugConfig" signing config pointing at
          # <rootDir>/debug.keystore, which is gitignored. Recreate it with the
          # standard AOSP debug credentials so :app:assembleDebug can sign.
          if [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          elif [ ! -f debug.keystore ]; then
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storetype PKCS12 \
              -storepass android \
              -keypass android \
              -alias androiddebugkey \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Run Unit Tests
        run: gradle :app:testDebugUnitTest --stacktrace

      - name: Build Debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v5
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: Upload Test Reports
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: unit-test-reports
          path: |
            app/build/reports/tests/
            app/build/test-results/
          retention-days: 7
          if-no-files-found: ignore

  release:
    name: Build Release Bundle (AAB) & APK
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.1'

      - name: Prepare Environment Files
        run: cp .env.example .env

      # Uses the real upload key when KEYSTORE_BASE64 is configured as a repository
      # secret. Without it the artifacts are still produced, but signed with a
      # throwaway key - installable for testing, NOT publishable to Google Play.
      - name: Prepare Upload Keystore
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            if [ -z "$STORE_PASSWORD" ] || [ -z "$KEY_PASSWORD" ]; then
              echo "::error title=Incomplete signing secrets::KEYSTORE_BASE64 is set, but STORE_PASSWORD and/or KEY_PASSWORD are missing. Add them under Settings > Secrets and variables > Actions."
              exit 1
            fi
            echo "$KEYSTORE_BASE64" | base64 -d > my-upload-key.jks
            echo "suffix=" >> "$GITHUB_OUTPUT"
            echo "Release artifacts will be signed with the configured upload key."
          else
            echo "::warning title=No upload key configured::KEYSTORE_BASE64 secret is not set. The release AAB/APK will be signed with a throwaway key. They are installable for testing, but they CANNOT be published to Google Play, and they can never update a listing signed with a different key."
            keytool -genkeypair -v \
              -keystore my-upload-key.jks \
              -storetype PKCS12 \
              -storepass testonly \
              -keypass testonly \
              -alias upload \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Orot Test Signing, O=Unofficial, C=IL"
            echo "suffix=-TEST-SIGNED-do-not-publish" >> "$GITHUB_OUTPUT"
          fi

      # bundleRelease produces the .aab that Google Play requires for new apps.
      # assembleRelease is kept alongside it for sideloading / direct distribution.
      - name: Build Release Bundle (AAB) and APK
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD || 'testonly' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || 'testonly' }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS || 'upload' }}
        run: gradle :app:bundleRelease :app:assembleRelease --stacktrace

      - name: Verify Signatures
        run: |
          AAB=$(find app/build/outputs/bundle/release -name '*.aab' | head -1)
          echo "Built bundle: $AAB"
          # An .aab is a jar-signed zip, so jarsigner (not apksigner) verifies it.
          jarsigner -verify -verbose:summary -certs "$AAB" | head -40

          APK=$(find app/build/outputs/apk/release -name '*.apk' | head -1)
          echo "Built APK: $APK"
          "$ANDROID_HOME"/build-tools/*/apksigner verify --print-certs "$APK" || \
            echo "::warning::apksigner not available; skipping APK signature verification."

      - name: Upload Release Bundle (AAB) Artifact
        uses: actions/upload-artifact@v5
        with:
          name: app-release-aab${{ steps.keystore.outputs.suffix }}
          path: app/build/outputs/bundle/release/*.aab
          retention-days: 90
          if-no-files-found: error

      # Play requires this file to deobfuscate crash reports. Harmless to upload
      # even while minification is off - the step just no-ops if it is absent.
      - name: Upload Native Debug Symbols & Mapping
        uses: actions/upload-artifact@v5
        with:
          name: app-release-mapping${{ steps.keystore.outputs.suffix }}
          path: |
            app/build/outputs/mapping/release/mapping.txt
            app/build/outputs/native-debug-symbols/release/*.zip
          retention-days: 90
          if-no-files-found: ignore

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v5
        with:
          name: app-release-apk${{ steps.keystore.outputs.suffix }}
          path: app/build/outputs/apk/release/*.apk
          retention-days: 90
          if-no-files-found: error

      - name: Remove Keystore
        if: always()
        run: rm -f my-upload-key.jks
